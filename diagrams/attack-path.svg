<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="320" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Figure 3 — Reconstructed Attack Path (October 3, 2024)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a3b3b"/>
    </marker>
  </defs>

  <!-- Step boxes -->
  <g>
    <rect x="30" y="90" width="205" height="120" rx="10" fill="#fdecec" stroke="#c94f4f" stroke-width="1.6"/>
    <text x="132" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8f2d2d">1. Entry Point</text>
    <text x="132" y="140" text-anchor="middle" font-size="11" fill="#333">SQL injection against</text>
    <text x="132" y="155" text-anchor="middle" font-size="11" fill="#333">the internally-built web</text>
    <text x="132" y="170" text-anchor="middle" font-size="11" fill="#333">application, over HTTP</text>
    <text x="132" y="185" text-anchor="middle" font-size="11" fill="#333">(port 80)</text>
  </g>

  <line x1="235" y1="150" x2="270" y2="150" stroke="#8a3b3b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="270" y="90" width="205" height="120" rx="10" fill="#fff0f6" stroke="#c94f9a" stroke-width="1.6"/>
    <text x="372" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8c1f68">2. Credential Harvest</text>
    <text x="372" y="140" text-anchor="middle" font-size="11" fill="#333">Injection flaw exposes</text>
    <text x="372" y="155" text-anchor="middle" font-size="11" fill="#333">backend data, including</text>
    <text x="372" y="170" text-anchor="middle" font-size="11" fill="#333">usable credentials</text>
  </g>

  <line x1="475" y1="150" x2="510" y2="150" stroke="#8a3b3b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="510" y="90" width="220" height="120" rx="10" fill="#fff8e1" stroke="#c9a227" stroke-width="1.6"/>
    <text x="620" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c0a">3. Lateral Movement</text>
    <text x="620" y="140" text-anchor="middle" font-size="11" fill="#333">Harvested credentials +</text>
    <text x="620" y="155" text-anchor="middle" font-size="11" fill="#333">SFTP default logins</text>
    <text x="620" y="170" text-anchor="middle" font-size="11" fill="#333">(admin:admin) let attacker</text>
    <text x="620" y="185" text-anchor="middle" font-size="11" fill="#333">browse internal file shares</text>
  </g>

  <line x1="730" y1="150" x2="765" y2="150" stroke="#8a3b3b" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="765" y="90" width="205" height="120" rx="10" fill="#f2eaff" stroke="#7c3fc4" stroke-width="1.6"/>
    <text x="867" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a1f80">4. Exfiltration</text>
    <text x="867" y="140" text-anchor="middle" font-size="11" fill="#333">High-volume, repeated</text>
    <text x="867" y="155" text-anchor="middle" font-size="11" fill="#333">HTTP connections to a</text>
    <text x="867" y="170" text-anchor="middle" font-size="11" fill="#333">single external IP move</text>
    <text x="867" y="185" text-anchor="middle" font-size="11" fill="#333">sensitive data off-network</text>
  </g>

  <rect x="30" y="245" width="940" height="55" rx="8" fill="#eefaf0" stroke="#2f9e56" stroke-width="1.3"/>
  <text x="500" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6b39">Detected via SIEM anomaly + WAF log correlation (Network Security Analysis, §Tools)</text>
  <text x="500" y="286" text-anchor="middle" font-size="11" fill="#2a5a3d">Each step above is closed by a specific control in the redesigned architecture — see Figure 2</text>
</svg>
