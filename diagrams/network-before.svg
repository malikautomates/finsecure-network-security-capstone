<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Figure 1 — FinSecure Previous Network Architecture</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#555555">Flat DMZ, single WAF, no dedicated database isolation</text>

  <!-- Internet / customers -->
  <ellipse cx="500" cy="100" rx="90" ry="30" fill="#eef2f7" stroke="#7a8ba0" stroke-width="1.5"/>
  <text x="500" y="105" text-anchor="middle" font-size="13" fill="#26364a">Internet / Customers</text>

  <!-- Single WAF -->
  <rect x="440" y="150" width="120" height="42" rx="6" fill="#fde8d8" stroke="#c9711f" stroke-width="1.5"/>
  <text x="500" y="176" text-anchor="middle" font-size="13" fill="#7a3d0c">1 WAF</text>
  <line x1="500" y1="130" x2="500" y2="150" stroke="#7a8ba0" stroke-width="1.5"/>

  <!-- DMZ box containing everything -->
  <rect x="70" y="220" width="480" height="330" rx="10" fill="#fdecec" stroke="#c94f4f" stroke-width="2"/>
  <text x="310" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#8f2d2d">DMZ (single flat zone)</text>
  <line x1="310" y1="192" x2="310" y2="220" stroke="#7a8ba0" stroke-width="1.5"/>

  <rect x="95" y="265" width="200" height="46" rx="6" fill="#ffffff" stroke="#c94f4f" stroke-width="1.3"/>
  <text x="195" y="293" text-anchor="middle" font-size="12.5" fill="#333">4 Web Application Servers</text>

  <rect x="315" y="265" width="200" height="46" rx="6" fill="#ffffff" stroke="#c94f4f" stroke-width="1.3"/>
  <text x="415" y="293" text-anchor="middle" font-size="12.5" fill="#333">2 SFTP Servers</text>

  <rect x="95" y="330" width="200" height="46" rx="6" fill="#ffffff" stroke="#c94f4f" stroke-width="1.3"/>
  <text x="195" y="358" text-anchor="middle" font-size="12.5" fill="#333">Redis Cache Server</text>

  <rect x="315" y="330" width="200" height="46" rx="6" fill="#ffffff" stroke="#c94f4f" stroke-width="1.3"/>
  <text x="415" y="352" text-anchor="middle" font-size="12" fill="#333">PCI-DSS Database</text>
  <text x="415" y="367" text-anchor="middle" font-size="10.5" fill="#8f2d2d">(no additional isolation)</text>

  <rect x="95" y="400" width="420" height="46" rx="6" fill="#fff3f3" stroke="#c94f4f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="305" y="428" text-anchor="middle" font-size="12" fill="#8f2d2d">Same zone as web + database — no lateral-movement barrier</text>

  <rect x="95" y="470" width="420" height="60" rx="6" fill="#ffffff" stroke="#c94f4f" stroke-width="1.3"/>
  <text x="305" y="495" text-anchor="middle" font-size="12.5" fill="#333">Cloud DB Server + Cloud VPN Server</text>
  <text x="305" y="513" text-anchor="middle" font-size="10.5" fill="#777">(reachable from the same flat zone)</text>

  <!-- Internal VLAN network -->
  <rect x="610" y="220" width="330" height="330" rx="10" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="775" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#7a5c0a">Internal Network (flat)</text>

  <rect x="630" y="265" width="130" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="695" y="290" text-anchor="middle" font-size="12" fill="#333">2 Active Directory</text>

  <rect x="775" y="265" width="140" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="845" y="290" text-anchor="middle" font-size="12" fill="#333">AAA Server</text>

  <rect x="630" y="320" width="130" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="695" y="345" text-anchor="middle" font-size="12" fill="#333">DNS Server</text>

  <rect x="775" y="320" width="140" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="845" y="345" text-anchor="middle" font-size="12" fill="#333">2 SFTP Servers</text>

  <rect x="630" y="380" width="285" height="46" rx="6" fill="#fffbe8" stroke="#c9a227" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="772" y="408" text-anchor="middle" font-size="12" fill="#7a5c0a">No VLAN separation between departments</text>

  <rect x="630" y="450" width="80" height="70" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="670" y="490" text-anchor="middle" font-size="12" fill="#333">HR</text>
  <rect x="720" y="450" width="80" height="70" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="760" y="490" text-anchor="middle" font-size="12" fill="#333">Finance</text>
  <rect x="810" y="450" width="105" height="70" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="862" y="490" text-anchor="middle" font-size="12" fill="#333">IT</text>

  <line x1="550" y1="290" x2="610" y2="290" stroke="#7a8ba0" stroke-width="1.5"/>

  <rect x="70" y="565" width="860" height="40" rx="6" fill="#fdecec" stroke="#c94f4f" stroke-width="1"/>
  <text x="500" y="590" text-anchor="middle" font-size="12" fill="#8f2d2d">Result: a single SQL-injection foothold on any web server can reach the database and, via weak SFTP credentials, the entire network.</text>
</svg>
