<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Figure 4 — Zero Trust Access Decision Flow</text>
  <text x="500" y="52" text-anchor="middle" font-size="12.5" fill="#555555">"Never trust, always verify" — applied to every request, employee or B2B partner, on- or off-network</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b5bdb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c94f4f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f9e56"/>
    </marker>
  </defs>

  <rect x="30" y="85" width="170" height="70" rx="10" fill="#eef2f7" stroke="#7a8ba0" stroke-width="1.5"/>
  <text x="115" y="112" text-anchor="middle" font-size="12" fill="#26364a">User or device</text>
  <text x="115" y="130" text-anchor="middle" font-size="12" fill="#26364a">requests access</text>

  <line x1="200" y1="120" x2="240" y2="120" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="240" y="85" width="190" height="70" rx="10" fill="#e3ecff" stroke="#3b5bdb" stroke-width="1.6"/>
  <text x="335" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#1f3699">AAA Server</text>
  <text x="335" y="126" text-anchor="middle" font-size="11" fill="#28418c">Identity verification</text>
  <text x="335" y="142" text-anchor="middle" font-size="11" fill="#28418c">+ MFA challenge</text>

  <line x1="430" y1="120" x2="470" y2="120" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="470" y="85" width="220" height="70" rx="10" fill="#f1f0ff" stroke="#6a4bd6" stroke-width="1.6"/>
  <text x="580" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#3c2a80">Context-Aware Policy Check</text>
  <text x="580" y="123" text-anchor="middle" font-size="11" fill="#3c2a80">role (RBAC) · device posture</text>
  <text x="580" y="139" text-anchor="middle" font-size="11" fill="#3c2a80">location · behavior pattern</text>

  <line x1="690" y1="120" x2="730" y2="120" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="730" y="85" width="220" height="70" rx="10" fill="#fde8d8" stroke="#c9711f" stroke-width="1.6"/>
  <text x="840" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#7a3d0c">NGFW Enforcement</text>
  <text x="840" y="126" text-anchor="middle" font-size="11" fill="#7a3d0c">applies the decision at the</text>
  <text x="840" y="142" text-anchor="middle" font-size="11" fill="#7a3d0c">network edge in real time</text>

  <line x1="840" y1="155" x2="840" y2="200" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Branch -->
  <line x1="840" y1="200" x2="600" y2="250" stroke="#2f9e56" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="840" y1="200" x2="900" y2="250" stroke="#c94f4f" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="440" y="265" width="220" height="70" rx="10" fill="#eefaf0" stroke="#2f9e56" stroke-width="1.6"/>
  <text x="550" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#1f6b39">Access Granted</text>
  <text x="550" y="308" text-anchor="middle" font-size="11" fill="#1f6b39">scoped to least privilege,</text>
  <text x="550" y="324" text-anchor="middle" font-size="11" fill="#1f6b39">continuously re-verified</text>

  <rect x="700" y="265" width="270" height="90" rx="10" fill="#fdecec" stroke="#c94f4f" stroke-width="1.6"/>
  <text x="835" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#8f2d2d">Access Denied /</text>
  <text x="835" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#8f2d2d">Device Quarantined</text>
  <text x="835" y="322" text-anchor="middle" font-size="11" fill="#8f2d2d">AAA ↔ NGFW automated</text>
  <text x="835" y="338" text-anchor="middle" font-size="11" fill="#8f2d2d">response, no manual step</text>

  <line x1="550" y1="335" x2="550" y2="360" stroke="#2f9e56" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="550" y1="360" x2="150" y2="360" stroke="#2f9e56" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowGreen)"/>
  <text x="350" y="378" text-anchor="middle" font-size="10.5" fill="#1f6b39">posture / behavior re-checked continuously — not a one-time gate</text>

  <rect x="30" y="410" width="940" height="40" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
  <text x="500" y="435" text-anchor="middle" font-size="11.5" fill="#444">Applies identically to FinSecure employees, remote/VPN sessions, and the GlobalTech Industries B2B connection.</text>
</svg>
