<svg viewBox="0 0 1080 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="900" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Figure 2 — FinSecure Redesigned Network Architecture</text>
  <text x="540" y="56" text-anchor="middle" font-size="13" fill="#555555">Defense-in-depth: NGFW perimeter, dual active WAFs, three-tier application segmentation, isolated internal VLANs</text>

  <!-- Customer connection -->
  <rect x="40" y="80" width="230" height="70" rx="8" fill="#eef2f7" stroke="#7a8ba0" stroke-width="1.5"/>
  <text x="155" y="108" text-anchor="middle" font-size="12.5" fill="#26364a">Customer Connection</text>
  <text x="155" y="126" text-anchor="middle" font-size="11" fill="#26364a">GlobalTech + VPN gateway</text>
  <text x="155" y="140" text-anchor="middle" font-size="10" fill="#5a6b7d">via ISP1 / ISP2</text>

  <!-- NGFW -->
  <rect x="320" y="80" width="180" height="70" rx="8" fill="#e3ecff" stroke="#3b5bdb" stroke-width="1.8"/>
  <text x="410" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1f3699">NGFW</text>
  <text x="410" y="122" text-anchor="middle" font-size="10.5" fill="#28418c">IPS · VPN · DLP</text>
  <text x="410" y="136" text-anchor="middle" font-size="10.5" fill="#28418c">network gateway</text>
  <line x1="270" y1="115" x2="320" y2="115" stroke="#7a8ba0" stroke-width="1.5"/>

  <!-- SIEM + backup -->
  <rect x="540" y="80" width="230" height="70" rx="8" fill="#f1f0ff" stroke="#6a4bd6" stroke-width="1.5"/>
  <text x="655" y="108" text-anchor="middle" font-size="12.5" fill="#3c2a80">Primary + Backup SIEM</text>
  <text x="655" y="126" text-anchor="middle" font-size="10.5" fill="#3c2a80">Central log correlation &amp; alerting</text>

  <!-- dual WAF -->
  <rect x="330" y="185" width="160" height="46" rx="6" fill="#fde8d8" stroke="#c9711f" stroke-width="1.5"/>
  <text x="410" y="213" text-anchor="middle" font-size="12.5" fill="#7a3d0c">2 WAF (active-active)</text>
  <line x1="410" y1="150" x2="410" y2="185" stroke="#7a8ba0" stroke-width="1.5"/>

  <!-- DMZ -->
  <rect x="40" y="255" width="500" height="110" rx="10" fill="#fdecec" stroke="#c94f4f" stroke-width="2"/>
  <text x="290" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#8f2d2d">DMZ — Public Network</text>
  <rect x="65" y="298" width="450" height="46" rx="6" fill="#ffffff" stroke="#c94f4f" stroke-width="1.3"/>
  <text x="290" y="326" text-anchor="middle" font-size="12.5" fill="#333">4 Public Web Servers (static content only)</text>
  <line x1="410" y1="231" x2="290" y2="255" stroke="#7a8ba0" stroke-width="1.5"/>

  <!-- Web App zone -->
  <rect x="40" y="390" width="500" height="110" rx="10" fill="#fff0f6" stroke="#c94f9a" stroke-width="2"/>
  <text x="290" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#8c1f68">Web Application Server Zone (Intranet)</text>
  <rect x="65" y="433" width="450" height="46" rx="6" fill="#ffffff" stroke="#c94f9a" stroke-width="1.3"/>
  <text x="290" y="461" text-anchor="middle" font-size="12.5" fill="#333">2 Web Application Servers + Load Balancer + Firewall</text>
  <line x1="290" y1="365" x2="290" y2="390" stroke="#7a8ba0" stroke-width="1.5"/>
  <text x="500" y="380" text-anchor="middle" font-size="10.5" fill="#8f2d2d">firewall boundary ↓</text>

  <!-- DB zone -->
  <rect x="40" y="525" width="500" height="160" rx="10" fill="#f2eaff" stroke="#7c3fc4" stroke-width="2"/>
  <text x="290" y="550" text-anchor="middle" font-size="14" font-weight="700" fill="#4a1f80">Database Zone (Intranet)</text>
  <rect x="65" y="565" width="215" height="46" rx="6" fill="#ffffff" stroke="#7c3fc4" stroke-width="1.3"/>
  <text x="172" y="593" text-anchor="middle" font-size="12" fill="#333">3 PostgreSQL + 2 Redis</text>
  <rect x="300" y="565" width="215" height="46" rx="6" fill="#ffffff" stroke="#7c3fc4" stroke-width="1.3"/>
  <text x="407" y="587" text-anchor="middle" font-size="11.5" fill="#333">PCI-DSS Cardholder DB</text>
  <text x="407" y="601" text-anchor="middle" font-size="10" fill="#4a1f80">behind its OWN dedicated firewall</text>
  <rect x="65" y="622" width="450" height="46" rx="6" fill="#ffffff" stroke="#7c3fc4" stroke-width="1.3"/>
  <text x="290" y="650" text-anchor="middle" font-size="12" fill="#333">2 SFTP Servers — key-based auth (no defaults)</text>
  <line x1="290" y1="500" x2="290" y2="525" stroke="#7a8ba0" stroke-width="1.5"/>
  <text x="500" y="515" text-anchor="middle" font-size="10.5" fill="#4a1f80">firewall boundary ↓</text>

  <!-- Internal VLAN network -->
  <rect x="600" y="255" width="440" height="430" rx="10" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="820" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5c0a">Internal VLAN Network</text>

  <rect x="620" y="298" width="130" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="685" y="323" text-anchor="middle" font-size="11.5" fill="#333">2 Active Directory</text>
  <rect x="760" y="298" width="130" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="825" y="323" text-anchor="middle" font-size="11.5" fill="#333">DNS Server</text>
  <rect x="900" y="298" width="120" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="960" y="323" text-anchor="middle" font-size="11.5" fill="#333">AAA Server</text>

  <rect x="620" y="352" width="400" height="42" rx="6" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="820" y="377" text-anchor="middle" font-size="11.5" fill="#333">2 SFTP Servers (internal transfer)</text>

  <rect x="620" y="406" width="400" height="40" rx="6" fill="#fffbe8" stroke="#c9a227" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="820" y="431" text-anchor="middle" font-size="11" fill="#7a5c0a">Multilayer switch — per-department VLAN separation</text>

  <rect x="620" y="470" width="120" height="90" rx="8" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="680" y="510" text-anchor="middle" font-size="12" fill="#333">HR VLAN</text>
  <rect x="760" y="470" width="120" height="90" rx="8" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="820" y="510" text-anchor="middle" font-size="12" fill="#333">Finance VLAN</text>
  <rect x="900" y="470" width="120" height="90" rx="8" fill="#ffffff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="960" y="510" text-anchor="middle" font-size="12" fill="#333">IT VLAN</text>

  <rect x="620" y="590" width="400" height="70" rx="8" fill="#eef5ff" stroke="#2f6fb0" stroke-width="1.3"/>
  <text x="820" y="614" text-anchor="middle" font-size="12" fill="#1c4a75">Cloud Database Server + Cloud VPN Server</text>
  <text x="820" y="632" text-anchor="middle" font-size="10.5" fill="#1c4a75">reached only through the NGFW / VPN path</text>

  <line x1="655" y1="115" x2="820" y2="255" stroke="#7a8ba0" stroke-width="1.3" stroke-dasharray="3 3"/>
  <line x1="540" y1="320" x2="600" y2="320" stroke="#7a8ba0" stroke-width="1.3" stroke-dasharray="3 3"/>

  <rect x="40" y="710" width="1000" height="150" rx="8" fill="#eefaf0" stroke="#2f9e56" stroke-width="1.3"/>
  <text x="540" y="735" text-anchor="middle" font-size="13" font-weight="700" fill="#1f6b39">Why this stops the October 3, 2024 attack path</text>
  <text x="60" y="760" font-size="11.5" fill="#2a5a3d">• DMZ web servers can no longer reach the database directly — every hop crosses a separate firewall boundary.</text>
  <text x="60" y="782" font-size="11.5" fill="#2a5a3d">• The cardholder database sits behind its own additional firewall inside the Database Zone, not "in" the DMZ.</text>
  <text x="60" y="804" font-size="11.5" fill="#2a5a3d">• SFTP servers require key-based auth — the default-credential path used in the breach is closed.</text>
  <text x="60" y="826" font-size="11.5" fill="#2a5a3d">• Department VLANs + AAA/NGFW integration contain lateral movement even if one segment is compromised.</text>
  <text x="60" y="848" font-size="11.5" fill="#2a5a3d">• Primary + backup SIEM give continuous, redundant visibility across every zone above.</text>
</svg>
